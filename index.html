<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Page with Hosted Script</title>
    <style>
        /* CSS to position the logo */
        .logo {
            position: absolute;
            top: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <!-- Logo placed at the top-right corner -->
    <img src="logo.png" alt="Logo" class="logo">

    <!-- Input field to collect digits and a submit button -->
    <label for="digitInput">Enter digits:</label>
    <input type="text" id="digitInput" placeholder="Enter digits only">
    <button onclick="submitValue()">Submit</button>

    <!-- Text field to display a value -->
    <p id="displayValue">Value will appear here</p>

    <!-- Reference to the hosted JavaScript file -->
    <script src="https://your-username.github.io/my-js-hosting/script.js"></script>
</body>
</html>
